name: Apply WarFrontier Droid Update

on:
  push:
    branches:
      - feature/federation-faction-package
    paths:
      - "tools/warfrontier-engine/apply_droid_update_patch.py"

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/federation-faction-package
          fetch-depth: 0

      - name: Apply idempotent engine patch
        run: python3 tools/warfrontier-engine/apply_droid_update_patch.py

      - name: Commit generated integration
        run: |
          if git diff --quiet -- src/droid.cpp; then
            echo "WarFrontier droid update integration is already present."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/droid.cpp
          git commit -m "feat: update WarFrontier combat state in droid loop"
          git push origin HEAD:feature/federation-faction-package
