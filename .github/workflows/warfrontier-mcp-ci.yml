name: WarFrontier MCP CI

on:
  push:
    branches:
      - feature/warfrontier-mcp
    paths:
      - "tools/warfrontier-mcp/**"
      - ".github/workflows/warfrontier-mcp-ci.yml"
  pull_request:
    paths:
      - "tools/warfrontier-mcp/**"
      - ".github/workflows/warfrontier-mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tools/warfrontier-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build MCP server
        run: npm run build

      - name: Verify compiled entry point
        run: test -f dist/index.js

      - name: Upload compiled MCP
        uses: actions/upload-artifact@v4
        with:
          name: warfrontier-mcp-dist
          path: tools/warfrontier-mcp/dist
          if-no-files-found: error
          retention-days: 14
